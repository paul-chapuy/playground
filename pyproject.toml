[project]
name = "panel-access-playground"
version = "0.1.0"
description = "Small HoloViz Panel app for experimenting with frontend access management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "panel>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
